<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Redes VLSM (tipo ipcalc)</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #1e1e1e; color: #d4d4d4; margin: 0; }
    .card { background: #252526; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); max-width: 950px; margin: auto; }
    h2 { color: #569cd6; margin-top: 0; text-align: center; }
    .input-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    .input-field { flex: 1; min-width: 240px; }
    label { display: block; margin-top: 5px; font-weight: bold; font-size: 0.9em; color: #9cdcfe; }
    input { width: 100%; padding: 9px; margin-top: 5px; box-sizing: border-box; background: #3c3c3c; color: #fff; border: 1px solid #555; border-radius: 4px; font-family: monospace; font-size: 14px; }
    small { color: #999; display: block; margin-top: 4px; font-size: 0.8em; }
    button { margin-top: 15px; width: 100%; padding: 12px; background-color: #0e639c; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #1177bb; }
    
    /* Estilo Terminal tipo ipcalc */
    .terminal { font-family: 'Courier New', Courier, monospace; background: #000; color: #00ff00; padding: 15px; border-radius: 6px; margin-top: 20px; font-size: 13px; line-height: 1.45; overflow-x: auto; white-space: pre; border: 1px solid #333; }
    .t-blue { color: #5b9bd5; }
    .t-cyan { color: #4ec9b0; }
    .t-yellow { color: #dcdcaa; }
    .t-purple { color: #c586c0; }
    .t-pink { color: #ce9178; }
    .t-red { color: #f44747; }
    .t-green { color: #6a9955; font-weight: bold; }
    .t-borrowed { color: #ff4d4d; font-weight: bold; background-color: #3a0000; }
    .alert { color: #f44747; background-color: #3a0d0d; border: 1px solid #700; padding: 12px; border-radius: 4px; margin-top: 15px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="card">
  <h2>Calculadora de Redes VLSM (tipo ipcalc)</h2>
  
  <div class="input-group">
    <div class="input-field">
      <label for="ip">Dirección IP Base / Máscara inicial:</label>
      <input type="text" id="ip" value="172.16.0.0/16">
      <small>Ej: 192.168.1.0/24 (Clase C) o 172.16.0.0/16 (Clase B)</small>
    </div>
    <div class="input-field">
      <label for="hostsList">Hosts por subred (coma o formato Cantidad x Hosts):</label>
      <input type="text" id="hostsList" value="100x30, 50, 10">
      <small>Ej: "100, 50, 20" o "100x30" para crear 100 subredes de 30 hosts.</small>
    </div>
  </div>

  <button onclick="calcularVLSM()">Calcular Subredes VLSM</button>

  <div id="salida"></div>
</div>

<script>
function ipAInt(ipStr) {
  return ipStr.split('.').reduce((acc, oct) => (acc << 8) + parseInt(oct, 10), 0) >>> 0;
}

function intAIp(intVal) {
  return [(intVal >>> 24) & 255, (intVal >>> 16) & 255, (intVal >>> 8) & 255, intVal & 255].join('.');
}

function intABinarioHTML(intVal, cidrOriginal, cidrNuevo = 0) {
  let str = (intVal >>> 0).toString(2).padStart(32, '0');
  let octetos = [
    str.substring(0, 8),
    str.substring(8, 16),
    str.substring(16, 24),
    str.substring(24, 32)
  ];

  if (cidrNuevo === 0 || cidrNuevo <= cidrOriginal) {
    return octetos.join('.');
  }

  let resultadoHtml = '';
  for (let i = 0; i < 32; i++) {
    if (i > 0 && i % 8 === 0) resultadoHtml += '.';
    let char = str[i];
    if (i >= cidrOriginal && i < cidrNuevo) {
      resultadoHtml += `<span class="t-borrowed">${char}</span>`;
    } else {
      resultadoHtml += char;
    }
  }
  return resultadoHtml;
}

function obtenerInfoClase(primerOcteto) {
  if (primerOcteto >= 1 && primerOcteto <= 126) return { clase: 'A', desc: 'Class A, Private/Public Internet' };
  if (primerOcteto >= 128 && primerOcteto <= 191) return { clase: 'B', desc: 'Class B, Private/Public Internet' };
  if (primerOcteto >= 192 && primerOcteto <= 223) return { clase: 'C', desc: 'Class C, Private Internet' };
  return { clase: 'Reservada', desc: 'Class D/E Reserved' };
}

function recomendarClaseTotal(totalDireccionesNecesarias) {
  if (totalDireccionesNecesarias <= 256) {
    return 'Clase C (Ej: 192.168.1.0/24 - Soporta hasta 256 direcciones)';
  } else if (totalDireccionesNecesarias <= 65536) {
    return 'Clase B (Ej: 172.16.0.0/16 - Soporta hasta 65,536 direcciones)';
  } else {
    return 'Clase A (Ej: 10.0.0.0/8 - Para redes masivas de más de 65,536 direcciones)';
  }
}

function parsearRequerimientos(inputStr) {
  let lista = [];
  let partes = inputStr.split(',');

  for (let parte of partes) {
    let item = parte.trim().toLowerCase();
    if (!item) continue;

    if (item.includes('x') || item.includes('*')) {
      let sep = item.includes('x') ? 'x' : '*';
      let [cantStr, hostsStr] = item.split(sep);
      let cantidad = parseInt(cantStr.trim());
      let hosts = parseInt(hostsStr.trim());

      if (!isNaN(cantidad) && !isNaN(hosts) && cantidad > 0 && hosts > 0) {
        let limite = Math.min(cantidad, 2000); // Protección de memoria
        for (let k = 0; k < limite; k++) {
          lista.push(hosts);
        }
      }
    } else {
      let hosts = parseInt(item);
      if (!isNaN(hosts) && hosts > 0) {
        lista.push(hosts);
      }
    }
  }
  return lista;
}

function calcularVLSM() {
  const ipEntrada = document.getElementById('ip').value.trim();
  const hostsRaw = document.getElementById('hostsList').value.trim();
  const salida = document.getElementById('salida');

  salida.innerHTML = '';

  let partesIp = ipEntrada.split('/');
  let ipStr = partesIp[0];
  let octetos = ipStr.split('.');

  if (octetos.length !== 4 || octetos.some(o => isNaN(o) || o < 0 || o > 255)) {
    salida.innerHTML = '<div class="alert">Formato de IP inválido. Debe ser X.X.X.X/CIDR (Ej. 172.16.0.0/16).</div>';
    return;
  }

  const primerOcteto = parseInt(octetos[0]);
  const infoClase = obtenerInfoClase(primerOcteto);

  let cidrBase = partesIp[1] ? parseInt(partesIp[1]) : (infoClase.clase === 'A' ? 8 : infoClase.clase === 'B' ? 16 : 24);
  if (isNaN(cidrBase) || cidrBase < 1 || cidrBase > 30) {
    salida.innerHTML = '<div class="alert">Prefijo CIDR inválido. Usa un valor entre /1 y /30.</div>';
    return;
  }

  let requerimientos = parsearRequerimientos(hostsRaw);

  if (requerimientos.length === 0) {
    salida.innerHTML = '<div class="alert">Ingresa al menos una cantidad válida de hosts (Ej: 100, 50, 20 o 100x30).</div>';
    return;
  }

  // Ordenar de MAYOR a MENOR
  requerimientos.sort((a, b) => b - a);

  const ipInt = ipAInt(ipStr);
  const mascaraBaseInt = (0xFFFFFFFF << (32 - cidrBase)) >>> 0;
  const redBaseInt = (ipInt & mascaraBaseInt) >>> 0;
  const broadcastBaseInt = (redBaseInt | ~mascaraBaseInt) >>> 0;
  const capacidadTotalBloque = Math.pow(2, 32 - cidrBase);

  let totalDireccionesAsignadas = 0;
  let subredesCalculadas = [];
  let punteroRedInt = redBaseInt;

  for (let i = 0; i < requerimientos.length; i++) {
    let hostsReq = requerimientos[i];
    let bitsHost = Math.ceil(Math.log2(hostsReq + 2));
    let nuevoCidr = 32 - bitsHost;
    let tamanoBloque = Math.pow(2, bitsHost);
    let bitsPrestados = nuevoCidr - cidrBase;

    totalDireccionesAsignadas += tamanoBloque;

    let mascaraSubredInt = (0xFFFFFFFF << bitsHost) >>> 0;

    subredesCalculadas.push({
      numero: i + 1,
      hostsSolicitados: hostsReq,
      hostsDisponibles: tamanoBloque - 2,
      cidr: nuevoCidr,
      bitsPrestados: bitsPrestados,
      mascaraStr: intAIp(mascaraSubredInt),
      networkInt: punteroRedInt,
      hostMinInt: punteroRedInt + 1,
      hostMaxInt: (punteroRedInt + tamanoBloque) - 2,
      broadcastInt: (punteroRedInt + tamanoBloque) - 1
    });

    punteroRedInt = (punteroRedInt + tamanoBloque) >>> 0;
  }

  if (totalDireccionesAsignadas > capacidadTotalBloque) {
    let cidrSugerido = 32 - Math.ceil(Math.log2(totalDireccionesAsignadas));
    salida.innerHTML = `<div class="alert">
      <strong>Capacidad insuficiente en la red actual:</strong> Para crear tus <strong>${requerimientos.length} subredes</strong> necesitas <strong>${totalDireccionesAsignadas.toLocaleString()}</strong> direcciones IP en total, pero <code>${intAIp(redBaseInt)}/${cidrBase}</code> (Clase ${infoClase.clase}) solo tiene <strong>${capacidadTotalBloque.toLocaleString()}</strong> direcciones.<br><br>
      <strong>Recomendación del sistema:</strong> Cambia la IP base a una <strong>${recomendarClaseTotal(totalDireccionesAsignadas)}</strong> (requiere al menos un prefijo <code>/${cidrSugerido}</code>).
    </div>`;
    return;
  }

  let out = '<div class="terminal">';
  
  out += `<span class="t-blue">Address:</span>   ${ipStr.padEnd(22)} <span class="t-yellow">${intABinarioHTML(ipInt, cidrBase)}</span>\n`;
  out += `<span class="t-blue">Netmask:</span>   ${(intAIp(mascaraBaseInt) + ' = ' + cidrBase).padEnd(22)} <span class="t-yellow">${intABinarioHTML(mascaraBaseInt, cidrBase)}</span>\n`;
  out += `<span class="t-blue">Wildcard:</span>  ${intAIp(~mascaraBaseInt).padEnd(22)} <span class="t-yellow">${intABinarioHTML(~mascaraBaseInt, cidrBase)}</span>\n`;
  out += `=>\n`;
  out += `<span class="t-blue">Network:</span>   ${(intAIp(redBaseInt) + '/' + cidrBase).padEnd(22)} <span class="t-yellow">${intABinarioHTML(redBaseInt, cidrBase)}</span>\n`;
  out += `<span class="t-blue">Broadcast:</span> ${intAIp(broadcastBaseInt).padEnd(22)} <span class="t-yellow">${intABinarioHTML(broadcastBaseInt, cidrBase)}</span>\n`;
  out += `<span class="t-blue">Clase IP:</span>  ${('Clase ' + infoClase.clase).padEnd(22)} <span class="t-purple">${infoClase.desc}</span>\n\n`;

  out += `<span class="t-cyan">=== RESUMEN DE ASIGNACIÓN VLSM (${requerimientos.length} subredes creadas) ===</span>\n`;
  out += `<strong>Recomendación de Red:</strong> ${recomendarClaseTotal(totalDireccionesAsignadas)}\n`;
  out += `<strong>Direcciones usadas:</strong>   ${totalDireccionesAsignadas.toLocaleString()} de ${capacidadTotalBloque.toLocaleString()} disponibles (${(capacidadTotalBloque - totalDireccionesAsignadas).toLocaleString()} libres)\n`;
  out += `-----------------------------------------------------------------------------------------\n\n`;

  subredesCalculadas.forEach(sub => {
    let estadoBits = sub.bitsPrestados > 0 
      ? `<span class="t-red">SÍ (+${sub.bitsPrestados} bits prestados de /${cidrBase} a /${sub.cidr})</span>` 
      : `<span class="t-cyan">NO (Usa la máscara base /${sub.cidr})</span>`;

    out += `<span class="t-yellow">Subred #${sub.numero}</span> <span class="t-green">[Solicitados: ${sub.hostsSolicitados} hosts | Útiles: ${sub.hostsDisponibles} hosts]</span>\n`;
    out += `<strong>¿Se prestaron bits?:</strong> ${estadoBits}\n`;
    out += `<span class="t-blue">Netmask:</span>   ${(sub.mascaraStr + ' = ' + sub.cidr).padEnd(22)} <span class="t-yellow">${intABinarioHTML(ipAInt(sub.mascaraStr), cidrBase, sub.cidr)}</span>\n`;
    out += `<span class="t-blue">Network:</span>   ${(intAIp(sub.networkInt) + '/' + sub.cidr).padEnd(22)} <span class="t-yellow">${intABinarioHTML(sub.networkInt, cidrBase, sub.cidr)}</span>\n`;
    out += `<span class="t-blue">HostMin:</span>   ${intAIp(sub.hostMinInt).padEnd(22)} <span class="t-yellow">${intABinarioHTML(sub.hostMinInt, cidrBase, sub.cidr)}</span>\n`;
    out += `<span class="t-blue">HostMax:</span>   ${intAIp(sub.hostMaxInt).padEnd(22)} <span class="t-yellow">${intABinarioHTML(sub.hostMaxInt, cidrBase, sub.cidr)}</span>\n`;
    out += `<span class="t-blue">Broadcast:</span> ${intAIp(sub.broadcastInt).padEnd(22)} <span class="t-yellow">${intABinarioHTML(sub.broadcastInt, cidrBase, sub.cidr)}</span>\n\n`;
  });

  out += '</div>';
  salida.innerHTML = out;
}
</script>

</body>
</html>
